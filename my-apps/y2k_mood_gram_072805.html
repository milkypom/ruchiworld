    const PHOTO_FILTERS = [

    const MOOD_OPTIONS = [

      { id: 'retro', emoji: '💿', label: 'RETRO', color: 'bg-zinc-200 text-zinc-900 border border-zinc-900' },

    const INITIAL_POSTS = [
      {
        id: 'post-1',
        date: '2026-07-28',
        displayDate: '2026.07.28 [TUE]',
        title: '성수동 레트로 모노크롬 에세이',
        content: '무채색으로 물든 도시의 골목길. 아날로그 카메라의 셔터 소리가 조용한 공기를 가른다. 스틸 프레임 속에 담긴 그늘과 빛의 대비가 이상하리만치 마음을 편안하게 만든다.',
        photoUrl: 'https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=1000&q=80',
        filter: 'monoHigh',
        mood: MOOD_OPTIONS[1],
        weather: WEATHER_OPTIONS[0],
        location: 'SEOUL [SEOUNGSU]',
        tags: ['Y2K_VIBE', 'MONO_LOG', 'BLACK_WHITE', 'ARCHIVE'],
        likes: 42,
        isLiked: true,
        isBookmarked: true,
        comments: [
          { id: 'c1', author: 'MINJI_00', text: '사진 명암 콘트라스트 대박이에요! Y2K 피드 감성 최고 🖤', date: '15:20' }
        ]
      },
      {
        id: 'post-2',
        date: '2026-07-25',
        displayDate: '2026.07.25 [SAT]',
        title: '한강의 흑백 잔상과 고요한 바람',
        content: '해 질 무렵 한강 스탠드에 앉아 멍하니 강물을 바라보았다. 모든 색이 사라지고 어둠과 빛만 남는 시간. 조용히 생각의 타임라인을 정리해본다.',
        photoUrl: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1000&q=80',
        filter: 'silverGrain',
        mood: MOOD_OPTIONS[5],
        weather: WEATHER_OPTIONS[0],
        location: 'BANPO_RIVER_PARK',
        tags: ['NIGHT_WALK', 'MONOCHROME', 'SILVER_GRAIN', 'ARCHIVE'],
        likes: 89,
        isLiked: false,
        isBookmarked: false,
        comments: []
      },
      {
        id: 'post-3',
        date: '2026-07-21',
        displayDate: '2026.07.21 [TUE]',
        title: '빗소리와 캠코더 렌즈 너머',
        content: '창문을 세차게 두드리는 여름 빗소리. 책상 위 모노크롬 디스플레이와 오래된 흑백 잡지 한 권. 그 누구의 방해도 받지 않는 정적.',
        photoUrl: 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=1000&q=80',
        filter: 'camcorder',
        mood: MOOD_OPTIONS[2],
        weather: WEATHER_OPTIONS[2],
        location: 'STUDIO_ROOM_01',
        tags: ['RAINY_DAY', 'CYBER_STATIC', 'MONO_LOG', 'QUIET_TIME'],
        likes: 34,
        isLiked: true,
        isBookmarked: true,
        comments: []
      }
    ];

    function App() {
      const [theme, setTheme] = useState(THEMES.silver);
      const [posts, setPosts] = useState(INITIAL_POSTS);
      const [activeTab, setActiveTab] = useState('feed');

      const [searchQuery, setSearchQuery] = useState('');
      const [selectedMoodFilter, setSelectedMoodFilter] = useState('all');

      const [isCreateModalOpen, setIsCreateModalOpen] = useState(false);
      const [selectedPostDetail, setSelectedPostDetail] = useState(null);
      const [selectedTagReport, setSelectedTagReport] = useState(null);
      const [storyIndex, setStoryIndex] = useState(0);
      const [toastMessage, setToastMessage] = useState('');

      const [detailTagInput, setDetailTagInput] = useState('');
      const [editingCommentId, setEditingCommentId] = useState(null);
      const [editingCommentText, setEditingCommentText] = useState('');

      const [formData, setFormData] = useState({
        title: '',
        content: '',
        date: new Date().toISOString().split('T')[0],
        photoUrl: 'https://images.unsplash.com/photo-1518241353330-0f7941c2d9b5?auto=format&fit=crop&w=1000&q=80',
        filter: 'monoHigh',
        mood: MOOD_OPTIONS[0],
        weather: WEATHER_OPTIONS[0],
        location: '',
        tagInput: '',
        tags: ['Y2K_DIARY', 'MONO_LOG']
      });

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 3000);
      };

      const dynamicTagHighlights = useMemo(() => {
        const tagMap = {};

        posts.forEach(post => {
          post.tags.forEach(tag => {
            const uppercaseTag = tag.toUpperCase();
            if (!tagMap[uppercaseTag]) {
              tagMap[uppercaseTag] = {
                name: uppercaseTag,
                posts: []
              };
            }
            tagMap[uppercaseTag].posts.push(post);
          });
        });

        return Object.values(tagMap)
          .map(tagData => {
            const sortedPosts = [...tagData.posts].sort((a, b) => new Date(b.date) - new Date(a.date));
            return {
              tag: tagData.name,
              count: sortedPosts.length,
              image: sortedPosts[0].photoUrl,
              filter: sortedPosts[0].filter,
              posts: sortedPosts
            };
          })
          .sort((a, b) => b.count - a.count);
      }, [posts]);

      const handlePrevStory = () => {
        if (storyIndex > 0) {
          setStoryIndex(prev => prev - 1);
        }
      };

      const handleNextStory = () => {
        if (selectedTagReport && storyIndex < selectedTagReport.posts.length - 1) {
          setStoryIndex(prev => prev + 1);
        } else {
          setSelectedTagReport(null);
        }
      };

      const handleToggleLike = (postId, e) => {
        e?.stopPropagation();
        setPosts(prev =>
          prev.map(p => {
            if (p.id === postId) {
              const nextLiked = !p.isLiked;
              if (nextLiked) showToast('🖤 [LIKE] 마음이 기록되었습니다.');
              return {
                ...p,
                isLiked: nextLiked,
                likes: nextLiked ? p.likes + 1 : p.likes - 1
              };
            }
            return p;
          })
        );
        if (selectedPostDetail && selectedPostDetail.id === postId) {
          setSelectedPostDetail(prev => ({
            ...prev,
            isLiked: !prev.isLiked,
            likes: !prev.isLiked ? prev.likes + 1 : prev.likes - 1
          }));
        }
      };

      const handleToggleBookmark = (postId, e) => {
        e?.stopPropagation();
        setPosts(prev =>
          prev.map(p => {
            if (p.id === postId) {
              const nextSaved = !p.isBookmarked;
              showToast(nextSaved ? '🔖 [SAVED] Y2K 보관함에 저장' : '[RELEASED] 보관 해제');
              return { ...p, isBookmarked: nextSaved };
            }
            return p;
          })
        );
        if (selectedPostDetail && selectedPostDetail.id === postId) {
          setSelectedPostDetail(prev => ({ ...prev, isBookmarked: !prev.isBookmarked }));
        }
      };

      const handleAddTag = (tagToAdd) => {
        const cleanTag = tagToAdd.trim().replace(/^#/, '').toUpperCase();
        if (cleanTag && !formData.tags.includes(cleanTag)) {
          setFormData(prev => ({
            ...prev,
            tags: [...prev.tags, cleanTag],
            tagInput: ''
          }));
        }
      };

      const handleRemoveTag = (tagToRemove) => {
        setFormData(prev => ({
          ...prev,
          tags: prev.tags.filter(t => t !== tagToRemove)
        }));
      };

      const handleAddTagToPost = (postId, tagToAdd) => {
        const cleanTag = tagToAdd.trim().replace(/^#/, '').toUpperCase();
        if (!cleanTag) return;

        setPosts(prev =>
          prev.map(p => {
            if (p.id === postId) {
              if (!p.tags.includes(cleanTag)) {
                const updatedTags = [...p.tags, cleanTag];
                if (selectedPostDetail && selectedPostDetail.id === postId) {
                  setSelectedPostDetail({ ...selectedPostDetail, tags: updatedTags });
                }
                showToast(`🏷️ #${cleanTag} 태그가 추가되었습니다.`);
                return { ...p, tags: updatedTags };
              }
            }
            return p;
          })
        );
        setDetailTagInput('');
      };

      const handleRemoveTagFromPost = (postId, tagToRemove) => {
        setPosts(prev =>
          prev.map(p => {
            if (p.id === postId) {
              const updatedTags = p.tags.filter(t => t !== tagToRemove);
              if (selectedPostDetail && selectedPostDetail.id === postId) {
                setSelectedPostDetail({ ...selectedPostDetail, tags: updatedTags });
              }
              showToast(`🗑️ #${tagToRemove} 태그가 제거되었습니다.`);
              return { ...p, tags: updatedTags };
            }
            return p;
          })
        );
      };

      const handleCreatePost = (e) => {
        e.preventDefault();
        if (!formData.title.trim() || !formData.content.trim()) {
          showToast('⚠️ [ERROR] 제목과 내용을 모두 작성하세요.');
          return;
        }

        const selectedDate = formData.date ? new Date(formData.date + 'T00:00:00') : new Date();
        const dateStr = formData.date || selectedDate.toISOString().split('T')[0];
        const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
        const displayDateStr = `${selectedDate.getFullYear()}.${String(selectedDate.getMonth() + 1).padStart(2, '0')}.${String(selectedDate.getDate()).padStart(2, '0')} [${days[selectedDate.getDay()]}]`;

        const newEntry = {
          id: `post-${Date.now()}`,
          date: dateStr,
          displayDate: displayDateStr,
          title: formData.title,
          content: formData.content,
          photoUrl: formData.photoUrl,
          filter: formData.filter,
          mood: formData.mood,
          weather: formData.weather,
          location: formData.location.toUpperCase() || 'MONO_SPACE_00',
          tags: formData.tags.length > 0 ? formData.tags : ['DIARY'],
          likes: 0,
          isLiked: false,
          isBookmarked: false,
          comments: []
        };

        setPosts([newEntry, ...posts]);
        setIsCreateModalOpen(false);
        showToast('💾 [LOGGED] 새로운 Y2K 일기가 업데이트 되었습니다.');

        setFormData({
          title: '',
          content: '',
          date: new Date().toISOString().split('T')[0],
          photoUrl: 'https://images.unsplash.com/photo-1518241353330-0f7941c2d9b5?auto=format&fit=crop&w=1000&q=80',
          filter: 'monoHigh',
          mood: MOOD_OPTIONS[0],
          weather: WEATHER_OPTIONS[0],
          location: '',
          tagInput: '',
          tags: ['Y2K_DIARY', 'MONO_LOG']
        });
      };

      const handleDeletePost = (postId) => {
        setPosts(prev => prev.filter(p => p.id !== postId));
        setSelectedPostDetail(null);
        showToast('🗑️ [DELETED] 일기 삭제 완료.');
      };

      const handleAddComment = (postId, text) => {
        if (!text.trim()) return;
        setPosts(prev =>
          prev.map(p => {
            if (p.id === postId) {
              const updatedComments = [
                ...p.comments,
                { id: `c-${Date.now()}`, author: 'USER_2000', text, date: 'NOW' }
              ];
              if (selectedPostDetail && selectedPostDetail.id === postId) {
                setSelectedPostDetail({ ...selectedPostDetail, comments: updatedComments });
              }
              return { ...p, comments: updatedComments };
            }
            return p;
          })
        );
      };

      const handleDeleteComment = (postId, commentId) => {
        setPosts(prev =>
          prev.map(p => {

                        <span>// MANAGE_POST_TAGS</span>
                      </span>
                      <span className="text-[9px] text-zinc-500">클릭하여 태그 삭제</span>
                    </div>

                    <div className="flex flex-wrap gap-1.5">
                      {selectedPostDetail.tags.map(tag => (
                        <span
                          key={tag}
                          className="px-2 py-0.5 bg-zinc-800 text-zinc-100 text-[10px] font-bold border border-zinc-600 flex items-center gap-1 group hover:border-red-400"
                        >
                          #{tag}
                          <button
                            onClick={() => handleRemoveTagFromPost(selectedPostDetail.id, tag)}
                            className="text-zinc-400 hover:text-red-400 transition"
                            title="태그 삭제"
                          >
                            <X className="w-3 h-3" />
                          </button>
                        </span>
                      ))}
                    </div>

                    <div className="flex gap-1.5 pt-1">
                      <input
                        type="text"
                        placeholder="NEW_TAG_NAME..."
                        value={detailTagInput}
                        onChange={(e) => setDetailTagInput(e.target.value)}
                        onKeyDown={(e) => {
                          if (e.key === 'Enter') {
                            e.preventDefault();
                            handleAddTagToPost(selectedPostDetail.id, detailTagInput);
                          }
                        }}
                        className="flex-1 px-2.5 py-1 bg-zinc-900 border border-zinc-700 text-[11px] outline-none focus:border-white uppercase placeholder:text-zinc-600 font-mono"
                      />
                      <button
                        onClick={() => handleAddTagToPost(selectedPostDetail.id, detailTagInput)}
                        className="px-3 py-1 bg-white text-black text-[10px] font-black hover:bg-zinc-200 uppercase"
                      >
                        + ADD_TAG
                      </button>
                    </div>
                  </div>

                  {/* Comments Section */}
                  <div className="space-y-2 pt-1">
                    <h4 className="text-[10px] font-black text-zinc-400 uppercase">// MEMO_LOGS ({selectedPostDetail.comments.length})</h4>
                    <div className="space-y-1.5 max-h-36 overflow-y-auto pr-1">
                      {selectedPostDetail.comments.map(c => (
                        <div key={c.id} className="p-2 border border-zinc-800 bg-zinc-950 text-[10px] space-y-1">
                          <div className="flex items-center justify-between font-bold text-zinc-400">
                            <span className="text-zinc-300">{c.author}</span>
                            <div className="flex items-center gap-2">
                              <span className="text-[9px] text-zinc-500">{c.date}</span>
                              {editingCommentId !== c.id && (
                                <div className="flex items-center gap-1.5">
                                  <button
                                    onClick={() => handleStartEditComment(c)}
                                    className="text-[9px] text-zinc-400 hover:text-white uppercase font-bold underline"
                                  >
                                    EDIT
                                  </button>
                                  <button
                                    onClick={() => handleDeleteComment(selectedPostDetail.id, c.id)}
                                    className="p-0.5 text-zinc-400 hover:text-red-400 transition"
                                    title="댓글 삭제"
                                  >
                                    <X className="w-3.5 h-3.5" />
                                  </button>
                                </div>
                              )}
                            </div>
                          </div>

                          {editingCommentId === c.id ? (
                            <div className="flex items-center gap-1 mt-1">
                              <input
                                type="text"
                                value={editingCommentText}
                                onChange={(e) => setEditingCommentText(e.target.value)}
                                className="flex-1 px-2 py-0.5 bg-zinc-900 border border-zinc-700 text-white text-[10px] outline-none"
                                onKeyDown={(e) => {
                                  if (e.key === 'Enter') handleSaveEditComment(selectedPostDetail.id, c.id);
                                }}
                              />
                              <button
                                onClick={() => handleSaveEditComment(selectedPostDetail.id, c.id)}
                                className="px-2 py-0.5 bg-white text-black text-[9px] font-bold"
                              >
                                SAVE
                              </button>
                              <button
                                onClick={() => setEditingCommentId(null)}
                                className="px-2 py-0.5 border border-zinc-600 text-zinc-400 text-[9px]"
                              >
                                CANCEL
                              </button>
                            </div>
                          ) : (
                            <p className="text-zinc-300">{c.text}</p>
                          )}
                        </div>
                      ))}
                    </div>

                    <div className="flex gap-1.5 pt-1">
                      <input
                        type="text"
                        placeholder="ADD_MEMO..."
                        onKeyDown={(e) => {
                          if (e.key === 'Enter') {
                            handleAddComment(selectedPostDetail.id, e.target.value);
                            e.target.value = '';
                          }
                        }}
                        className="flex-1 px-3 py-1.5 bg-zinc-900 border border-zinc-700 text-xs outline-none focus:border-white uppercase placeholder:text-zinc-600"
                      />
                      <button
                        onClick={(e) => {
                          const input = e.currentTarget.previousElementSibling;
                          handleAddComment(selectedPostDetail.id, input.value);
                          input.value = '';
                        }}
                        className="px-3 py-1.5 bg-white text-black text-xs font-black hover:bg-zinc-200 uppercase"
                      >
                        ADD
                      </button>
                    </div>
                  </div>

                  <div className="flex justify-between items-center pt-3 border-t border-zinc-800">
                    <button
                      onClick={() => handleDeletePost(selectedPostDetail.id)}
                      className="text-xs text-zinc-400 hover:text-white flex items-center gap-1 uppercase font-bold"
                    >
                      <Trash2 className="w-3.5 h-3.5" />
                      <span>DELETE_LOG</span>
                    </button>

                    <button
                      onClick={() => {
                        showToast('🖼️ [EXPORT] Y2K 감성 모노 카드가 복사되었습니다.');
                      }}
                      className="px-3 py-1.5 border border-white text-xs font-bold hover:bg-white hover:text-black transition flex items-center gap-1.5 uppercase"
                    >
                      <Share2 className="w-3.5 h-3.5" />
                      <span>EXPORT_CARD</span>
                    </button>
                  </div>

                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
